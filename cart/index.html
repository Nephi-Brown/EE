<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WDD 330 - Edinburgh Entertainment MY Cart by Kim Brown, Web Development, JavaScript, CSS, HTML, JSON">
  <meta name="author" content="Kim Kathleen Brown">
  <title>Edinburgh Entertainment | My Cart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Open+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- NOTE: from /cart/ you must go up one level to styles -->
  <link rel="stylesheet" href="../styles/normalize.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/larger.css">
  <link rel="stylesheet" href="../styles/cards.css">

  <style>
    .products .product-list{grid-template-columns:repeat(5,minmax(0,1fr))}
    @media (max-width:1280px){.products .product-list{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media (max-width:992px){.products .product-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:720px){.products .product-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:480px){.products .product-list{grid-template-columns:1fr}}

    .card__actions{margin-top:8px;display:flex;justify-content:center}
    .btn.btn-remove{padding:8px 12px;border-radius:10px;border:none;cursor:pointer;background:#fee2e2;color:#991b1b;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    .btn.btn-remove:hover{filter:brightness(.98)}
    .empty-cart{padding:12px;color:#4b5563}

    /* Make the footer row visible and lay out totals + buttons */
    #cart-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:12px;border-top:1px solid #eee}
    #cart-footer.hide{display:none}
    #cart-footer .footer-actions{display:flex;gap:10px}
    #clear-cart-btn,#checkout-btn{padding:10px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    #clear-cart-btn{background:#f3f4f6;color:#111827}
    #checkout-btn{background:#4f46e5;color:#fff}
  </style>

  <script src="../js/getDates.js" type="module" defer></script>
  <script src="../js/hamButton.js" type="module" defer></script>
  <script src="../js/main.js" type="module" defer></script>
  <script src="../js/breadcrumb.js" type="module" defer></script>
  <script src="../js/cart.js" type="module" defer></script>
</head>

<body>
  <header class="has-corner-cart">
    <img src="../images/logo.png" alt="EE" loading="lazy" width="80" height="80">
    <h1>Edinburgh Entertainment My Cart</h1>

    <form class="search-bar" action="#" method="GET" role="search" aria-label="Search events">
      <input type="search" name="q" class="search-input" placeholder="Search Events" aria-label="Search events">
      <button class="search-btn" type="submit" aria-label="Search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        </svg>
      </button>
    </form>

    <a href="../cart/index.html" class="cart-btn" aria-label="Open cart">
      <img class="cart-img" src="../images/cart.png" width="35" height="35" alt="" aria-hidden="true">
      <span class="cart-count hide">0</span>
    </a>
  </header>

  <div class="nav-section">
    <button id="menu" aria-label="Toggle navigation menu"></button>
    <nav class="header-nav">
      <ul class="navigation">
        <li><a href="../index.html" class="active">Home</a></li>
        <li><a href="../product_listing/index.html">Events</a></li>
        <li><a href="../cart/index.html">My Cart</a></li>
        <li><a href="../checkout/index.html">Checkout</a></li>
      </ul>
    </nav>
  </div>

  <main>
    <nav id="breadcrumbs" class="breadcrumb" aria-label="Breadcrumb"></nav>
    <section class="products">
      <ul class="product-list" data-category="Cart"></ul>

      <!-- Footer row: totals + buttons -->
      <div class="cart-footer hide" id="cart-footer">
        <div>
          <p class="cart-total">Subtotal: <span id="cart-total">£0.00</span></p>
          <p class="cart-final">Final Total: <span id="cart-final">£0.00</span></p>
        </div>
        <div class="footer-actions">
          <button id="clear-cart-btn" type="button">Clear Cart</button>
          <button id="checkout-btn" type="button">Checkout</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>Contact Us: Phone:0123-456-7890</p>
    <p>Email: info@edinburghentertaiment.com</p>
    <nav class="footer-nav"></nav>
    <p>&copy; <span id="currentyear"></span> 🏴 WDD330 🏴 Kim Kathleen Brown 🏴 Edinburgh, Scotland 🏴</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
